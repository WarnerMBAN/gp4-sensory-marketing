# Streamlit settings for the GP4 dashboard (safe to commit: no secrets here).
# The API key, if ever needed on Streamlit Cloud, goes in the app's Secrets
# settings, never in this file.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false
